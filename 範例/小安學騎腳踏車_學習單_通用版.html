<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
<title>六何法分層寫作</title>
<!--
  六何法分層寫作小幫手（six-w-writing）範本
  - 不要手改這個檔案的內容，請改 lesson.json，再用 scripts/build.py 產生：
      互動網頁（MODE=web）、學生學習單（MODE=sheet）、教師版（MODE=teacher）。
  - 資料放在 <script id="lesson" type="application/json">，由下方程式畫出畫面。
-->
<style>
:root{
  --kai:"教育部標準楷書","TW-MOE-Std-Kai","標楷體","DFKai-SB","BiauKai","TW-Kai";
  --font:"Iansui","芫荽",var(--kai),serif;  /* 預設芫荽；不用黑體（筆順不符台灣標準字體） */
  --ink:#1f2937; --muted:#6b7280; --line:#cbd5e1; --bg:#f4f7fb; --paper:#fff;
  --c1:#3b82f6; --c2:#10b981; --c3:#8b5cf6; --c4:#ec4899; --c5:#f59e0b; --c6:#14b8a6; --c7:#6366f1; --c8:#0ea5e9;
  --t1:#eff6ff; --t2:#ecfdf5; --t3:#f5f3ff; --t4:#fdf2f8; --t5:#fffbeb; --t6:#f0fdfa; --t7:#eef2ff; --t8:#f0f9ff;
  --red:#dc2626; --fs:1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:calc(18px * var(--fs));line-height:1.6}
body.kai{--font:var(--kai),serif}
body.bpmf{--font:"Bpmf Iansui","芫荽注音","Iansui","芫荽",var(--kai),serif;line-height:2}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hide{display:none !important}

/* ================= 互動網頁 ================= */
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.bar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;max-width:1000px;margin:0 auto}
.bar .ttl{font-weight:700;font-size:1.05em;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.big{border:0;border-radius:12px;padding:8px 14px;min-height:46px;font-size:1em;background:#e0ecff;color:#1e3a8a}
.big.go{background:#2563eb;color:#fff}
.big.ok{background:#16a34a;color:#fff}
.big:disabled{opacity:.4;cursor:default}
.blocks{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:6px 12px 10px;max-width:1000px;margin:0 auto}
.blk{border:2px solid transparent;border-radius:10px;padding:4px 10px;font-size:.8em;background:#f1f5f9;color:#475569;cursor:pointer;display:flex;gap:6px;align-items:center}
.blk b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:#94a3b8;color:#fff;font-size:.9em}
.blk.done{background:#dcfce7;color:#166534}.blk.done b{background:#16a34a}
.blk.cur{border-color:#2563eb;background:#dbeafe;color:#1e3a8a}.blk.cur b{background:#2563eb}
.wrap{max-width:1000px;margin:0 auto;padding:16px 12px 120px}
.card{background:var(--paper);border-radius:18px;box-shadow:0 2px 12px rgba(15,23,42,.08);padding:20px 22px;margin-bottom:16px}
.lvh{display:flex;align-items:center;gap:12px;margin:-20px -22px 16px;padding:14px 22px;border-radius:18px 18px 0 0;color:#fff}
.lvh .num{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.3em;font-weight:700}
.lvh h2{margin:0;font-size:1.25em}
.lvh small{display:block;font-size:.72em;opacity:.95;font-weight:400}
.lvh .say{margin-left:auto}
.say{border:0;background:#fff;color:#1e3a8a;border-radius:50%;width:42px;height:42px;font-size:1.1em;flex:none}
.say.sm{width:34px;height:34px;font-size:.9em;background:#eef2ff}
.guide{background:#f8fafc;border-left:6px solid var(--lc,#3b82f6);padding:10px 14px;border-radius:8px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.guide p{margin:0;flex:1}
.field{display:grid;grid-template-columns:8.5em 1fr;gap:6px 12px;align-items:start;padding:10px 0;border-bottom:1px dashed #e5e7eb}
.field:last-of-type{border-bottom:0}
.field .lab{font-weight:700;color:var(--lc,#1e3a8a)}
.field .lab small{display:block;font-weight:400;color:var(--muted);font-size:.75em}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input,.inrow textarea{flex:1}
input.t,textarea.t{border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;width:100%;min-height:46px}
textarea.t{resize:vertical;line-height:1.8}
input.t:focus,textarea.t:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.t.good{border-color:#16a34a;background:#f0fdf4}
.t.try{border-color:#f59e0b;background:#fffbeb}
.mic{border:0;background:#fef3c7;border-radius:10px;min-width:46px;min-height:46px;font-size:1.1em}
.mic.on{background:#ef4444;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:2px solid #cbd5e1;background:#fff;border-radius:999px;padding:4px 14px;min-height:40px;font-size:.95em}
.chip.on{border-color:#2563eb;background:#dbeafe;color:#1e3a8a}
.chip:hover{border-color:#94a3b8}
.box{border-radius:12px;padding:10px 14px;margin:12px 0}
.box .bh{font-weight:700;font-size:.85em;color:var(--muted);margin-bottom:4px}
.bank{background:#fff7ed;border:1px dashed #fdba74}
.bank .chip{border-color:#fdba74}
.frame{background:#eef2ff;border:1px dashed #a5b4fc}
.frame .fv{display:inline-block;min-width:3em;border-bottom:2px solid #6366f1;color:#1e3a8a;font-weight:700;padding:0 4px;text-align:center}
.frame .fv.empty{color:#a5b4fc;font-weight:400;font-size:.8em}
.sent{margin-top:12px}
.sent .sl{font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:center}
details.model{background:#f0fdf4;border:1px dashed #86efac;border-radius:12px;padding:8px 14px;margin-top:12px}
details.model summary{cursor:pointer;font-weight:700;color:#166534}
.fb{margin-top:12px;padding:10px 14px;border-radius:10px;display:none}
.fb.show{display:block}
.fb.good{background:#dcfce7;color:#166534}
.fb.try{background:#fef3c7;color:#92400e}
.sort{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.slot{min-width:7.5em;min-height:52px;border:2px dashed #94a3b8;border-radius:12px;padding:6px 10px;display:flex;align-items:center;justify-content:center;text-align:center;background:#f8fafc;cursor:pointer;font-size:.9em}
.slot.fill{border-style:solid;border-color:#ec4899;background:#fdf2f8}
.slot.good{border-color:#16a34a;background:#dcfce7}
.slot.bad{border-color:#f59e0b;background:#fef3c7}
.arrow{color:#94a3b8;font-size:1.2em}
.ecard{border:2px solid #f9a8d4;background:#fff;border-radius:12px;padding:6px 12px;min-height:52px;font-size:.9em}
.ecard.used{opacity:.3;pointer-events:none}
.part{border-radius:12px;padding:10px 14px;margin:10px 0;border:2px solid #e5e7eb}
.part h3{margin:0 0 6px;font-size:1em;display:flex;gap:8px;align-items:center}
.part h3 small{color:var(--muted);font-weight:400}
.starter{color:#4f46e5;font-size:.9em;margin-bottom:6px}
.mats{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.9em}
.mats ol{margin:4px 0 0;padding-left:1.4em}
.cnt{font-size:.85em;color:var(--muted);text-align:right}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.checks label{display:flex;gap:6px;align-items:center;background:#f1f5f9;border-radius:10px;padding:6px 12px;cursor:pointer}
.checks input{width:22px;height:22px}
.mat{white-space:pre-wrap}
.mat p{margin:.3em 0;text-indent:2em}
.mat img,.sheetwrap .mat img{max-width:100%;border-radius:10px}
.navb{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.menu{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:50;display:none}
.menu.show{display:block}
.menu .pan{position:absolute;right:0;top:0;bottom:0;width:min(380px,92vw);background:#fff;padding:16px;overflow:auto}
.menu h3{margin:14px 0 6px;font-size:.95em;color:var(--muted)}
.menu .mb{display:block;width:100%;text-align:left;margin:4px 0;border:0;background:#f1f5f9;border-radius:10px;padding:10px 12px}
.menu label.sw{display:flex;gap:8px;align-items:center;padding:6px 4px}
.menu label.sw input{width:22px;height:22px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid #cbd5e1;background:#fff;border-radius:10px;padding:6px}
.seg button.on{border-color:#2563eb;background:#dbeafe}
#rec{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:60;display:none;align-items:center;justify-content:center}
#rec.show{display:flex}
#rec .rb{background:#fff;border-radius:16px;padding:16px;width:min(720px,94vw);max-height:90vh;overflow:auto}
#rec pre{white-space:pre-wrap;background:#f8fafc;border-radius:10px;padding:10px;font-family:var(--font);font-size:.85em}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:12px;z-index:70;display:none}
.speak{background:#fef08a !important;border-radius:6px}
.pick{max-width:640px;margin:40px auto;text-align:center}
.pick .big{display:block;width:100%;margin:10px 0}

/* ================= 學習單（列印） =================
   學生版：只留題目與作答空間，不放教學說明；書寫線 10mm、完整寫作用方格稿紙。 */
body.paper{background:#e5e7eb;font-size:13pt;line-height:1.6}
.sheetwrap{width:210mm;margin:0 auto}
.pg{background:#fff;width:210mm;min-height:297mm;padding:11mm 12mm;margin:10px auto;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.phead{display:flex;align-items:stretch;gap:0;border:2px solid #334155;border-radius:12px;overflow:hidden}
.phead .pb{background:#334155;color:#fff;padding:4px 12px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:11pt;line-height:1.25;text-align:center;min-width:24mm}
.phead .pb b{font-size:15pt;letter-spacing:2px}
.phead .ptt{flex:1;padding:4px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead .ptt h1{margin:0;font-size:20pt;font-weight:700;line-height:1.3}
.phead .ptt .ver{font-size:10.5pt;border:1.5px solid #334155;border-radius:999px;padding:0 10px;white-space:nowrap}
.pname{display:flex;gap:6mm;margin:3mm 1mm 2mm;font-size:12pt;align-items:flex-end}
.pname span{display:flex;align-items:flex-end;gap:2px;white-space:nowrap}
.pname i{display:inline-block;border-bottom:1.5px solid #334155;width:14mm;height:7mm}
.pname i.w{width:34mm}.pname i.s{width:9mm}
.pteach{font-size:10.5pt;background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:3px 10px;margin:2mm 0}
.pmat{border:1.5px solid #94a3b8;border-radius:10px;padding:2mm 4mm;margin:2mm 0 3mm;font-size:12pt;line-height:1.75;break-inside:avoid}
.pmat .mh{font-weight:700;font-size:12pt;margin-bottom:1mm}
.pmat p{margin:0;text-indent:2em}
.pmat img{display:block;margin:1mm auto;max-height:55mm;max-width:100%}
.plv{border:2px solid var(--lc);border-radius:12px;margin:0 0 4mm;break-inside:avoid;page-break-inside:avoid;overflow:hidden}
.plh{display:flex;align-items:center;gap:3mm;background:var(--lt);border-bottom:1.5px solid var(--lc);padding:1.5mm 4mm}
.plh .n{flex:none;width:8mm;height:8mm;border-radius:50%;background:var(--lc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12pt}
.plh b{flex:none;font-size:14pt;color:#1f2937}
.plh .q{font-size:12pt;color:#334155}
.pc{padding:2.5mm 4mm 3mm}
.pf{display:flex;flex-wrap:wrap;gap:1mm 7mm;align-items:flex-end}
.pf .it{display:flex;align-items:flex-end;gap:2mm;min-height:10mm;flex:1 1 52mm}
.pf .it.wide{flex-basis:100%}
.pf .it>b{white-space:nowrap;font-size:12.5pt}
.bl{display:inline-block;flex:1;min-width:24mm;border-bottom:1.5px solid #475569;min-height:9mm;line-height:9mm;text-align:center;padding:0 2mm}
.bl.in{flex:none;min-width:22mm;min-height:8mm;line-height:8mm;margin:0 1.5mm}
.bl small{color:#94a3b8;font-size:8.5pt}
.op{display:flex;flex-wrap:wrap;gap:2mm 3mm}
.op span{border:1.5px solid #94a3b8;border-radius:999px;padding:0 4mm;line-height:8mm;font-size:12pt}
.op span.ok{border-color:var(--red);color:var(--red);box-shadow:0 0 0 1.5px var(--red)}
.pbank{display:flex;flex-wrap:wrap;gap:1.5mm 2mm;align-items:center;margin:2mm 0 0;font-size:11pt}
.pbank b{font-size:10.5pt;color:#9a3412;background:#ffedd5;border-radius:5px;padding:0 2mm}
.pbank span{border:1px dashed #fdba74;border-radius:6px;padding:0 2mm;background:#fffaf5}
.pframe{background:#f5f7ff;border:1.5px dashed #a5b4fc;border-radius:8px;padding:1mm 3mm;margin:2.5mm 0 0;line-height:11mm;font-size:12.5pt}
.pframe>b{font-size:10.5pt;color:#4338ca;background:#e0e7ff;border-radius:5px;padding:0 2mm;margin-right:2mm}
.wlab{margin-top:2.5mm;font-size:12pt;color:#334155}
.wl{border-bottom:1.5px solid #94a3b8;height:10mm}
.wl.ansl{height:auto;min-height:10mm;line-height:10mm;color:var(--red);border-bottom:1.5px solid #94a3b8;white-space:pre-wrap;font-size:12pt}
.gridp{display:grid;grid-template-columns:repeat(var(--gc,17),10mm);justify-content:center;margin:2mm 0 0;border-top:1.5px solid #cbd5e1;border-left:1.5px solid #cbd5e1}
.gridp i{width:10mm;height:10mm;border-right:1.5px solid #cbd5e1;border-bottom:1.5px solid #cbd5e1}
.gridp i:nth-child(5n){border-right-color:#cbd5e1}
.pmodel{margin-top:2mm;font-size:10.5pt;color:#166534;background:#f0fdf4;border-radius:6px;padding:0 3mm}
.pcards{display:flex;flex-wrap:wrap;gap:2mm;margin:1mm 0 2mm}
.pcards span{border:1.5px solid #f9a8d4;background:#fff7fb;border-radius:8px;padding:0 3mm;line-height:9mm;font-size:12pt}
.pcards span em{font-style:normal;font-weight:700;color:#be185d;margin-right:1.5mm}
.psort{display:flex;flex-wrap:wrap;align-items:center;gap:2mm}
.psort .sb{position:relative;border:1.5px solid #ec4899;border-radius:8px;min-width:24mm;height:12mm;display:inline-flex;align-items:center;justify-content:center;padding:0 2mm;font-size:12pt;color:var(--red)}
.psort .sb.wide{min-width:52mm}
.psort .sb sup{position:absolute;top:-2.2mm;left:-2.2mm;width:5mm;height:5mm;border-radius:50%;background:#ec4899;color:#fff;font-size:8pt;line-height:5mm;text-align:center}
.psort .ar{color:#94a3b8}
.ppart{display:grid;grid-template-columns:17mm 1fr;gap:3mm;margin-top:2mm}
.ppart .pl{border-radius:8px;background:var(--lt);border:1.5px solid var(--lc);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:13pt}
.ppart .st{color:#4338ca;font-size:12pt;line-height:10mm;border-bottom:1.5px solid #94a3b8}
.pck{display:flex;flex-wrap:wrap;gap:2mm 6mm;font-size:12pt;margin-top:3mm;align-items:center}
.pck span::before,.pfoot span::before{content:"☐";font-size:14pt;margin-right:1mm}
.pfoot{display:flex;gap:6mm;flex-wrap:wrap;align-items:center;font-size:12pt;border-top:1.5px dashed #94a3b8;padding-top:2mm;margin-top:2mm;break-inside:avoid}
.ans .bl,.ans .tv{color:var(--red)}
.tsec{font-size:11pt}
.tsec h2{margin:0 0 2mm;font-size:18pt;text-align:center}
.tsec h3{font-size:13pt;margin:4mm 0 1.5mm;border-left:5px solid #334155;padding-left:8px}
.tsec table{border-collapse:collapse;width:100%;font-size:10.5pt}
.tsec th,.tsec td{border:1px solid #94a3b8;padding:4px 6px;text-align:left;vertical-align:top}
.tsec th{background:#f1f5f9;white-space:nowrap}
.tsec ul{margin:2px 0;padding-left:1.3em;font-size:10.5pt}
.tv{white-space:pre-wrap}
body.bpmf .pmat,body.bpmf .pc,body.bpmf .plh .q{line-height:2.1}
@page{size:A4;margin:11mm 12mm}
@media print{
  body,body.paper{background:#fff}
  .sheetwrap{width:auto}
  .pg{margin:0;padding:0;width:auto;box-shadow:none;page-break-after:always;min-height:auto}
  .pg:last-child{page-break-after:auto}
  .bar,.menu,.toast,#rec{display:none !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:640px){
  .field{grid-template-columns:1fr}
  .bar .ttl{max-width:100%;flex-basis:100%}
  .bar .row{gap:6px;padding:6px 8px}.big{padding:6px 10px;min-height:42px}
  .blocks{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:4px 8px 8px}.blk{white-space:nowrap;flex:none}
  .card{padding:16px 14px}.lvh{margin:-16px -14px 14px;padding:12px 14px}
}
</style>
</head>
<body>

用六何法寫一段自己的經驗，寫完再檢查。", "prompt": "你有沒有「一開始做不好，後來學會」的經驗？", "fields": [{"key": "my_what", "label": "我學會的事", "hint": "例如：游泳、跳繩、綁鞋帶", "open": true, "ans": ["跳繩"], "bank": ["游泳", "跳繩", "綁鞋帶", "溜直排輪", "煎蛋"]}, {"key": "my_why", "label": "為何一開始很難", "hint": "遇到什麼困難？", "open": true, "ans": ["一直被繩子絆到"]}, {"key": "my_how", "label": "後來我如何做到", "hint": "誰幫你？你用了什麼方法？", "open": true, "ans": ["每天下課跟同學一起練習"]}], "frame": "我曾經學{my_what}，一開始{my_why}，後來我{my_how}，終於學會了。", "model": "我曾經學跳繩，一開始一直被繩子絆到，後來我每天下課跟同學一起練習，終於學會了。", "lines": 3}}, "versions": [{"name": "通用版", "levels": [1, 2, 3, 4, 5, 6, 7, 8], "support": "中", "for": "全班"}, {"name": "提示多版", "levels": [1, 2, 3], "support": "多", "for": "基本句與原因表達：需要圈選、句型與口說支持的學生"}, {"name": "挑戰版", "levels": [5, 6, 7, 8], "support": "少", "for": "敘事組織與描寫：已能寫完整句子的學生"}], "teacher": {"tips": ["像堆積木一樣：先完成基本句，再加入時間、方法、原因與感受，每一層的句子都會帶到下一層。", "可跨層搭配，不必每次完成全部頁面；依學生當次表現調整提示量。", "先說再寫：口語能力較好但書寫困難的學生，可先說給老師聽或用 🎤 語音輸入，再抄寫或修改。", "第 3 層的兩層「為何」是理解人物轉變的關鍵：先問「為什麼不高興」，再問「為什麼改變」。", "第 7 層完成後，用四個檢核重點和學生一起回顧：內容完整、組織清楚、描寫具體、自主修訂。"], "adjust": {"學習內容": "依學生能力選層（第 1–3、4–6、7–8 層），可跨層搭配；全班目標相同，逐步減少提示量。", "學習歷程": "三何起步 → 五何擴寫 → 六何完整 → 事件排序 → 情緒加料 → 三段成文 → 完整寫作 → 遷移寫作，逐層堆疊；提供圈選、提示詞、句型、情緒詞庫、事件卡與範例。", "學習環境": "可用平板或電腦開啟互動網頁（報讀、點選、語音輸入）；座位靠近老師便於口說作答；可安排同儕夥伴。", "學習評量": "允許書寫、圈選、選詞或口說（老師代寫、語音輸入）任一方式作答；以四個檢核重點與作答紀錄追蹤進步。"}}, "source": "依據：閱讀理解策略應用與實作社群「閱讀延伸寫作策略：六何法分層寫作教材」七層次架構。改編自：https://courses.dale.nthu.edu.tw/repo/14342", "__mode": "sheet", "__version": 0}</script>
<script>

const MODE = L.__mode || 'web';          // web｜sheet｜teacher

  1:{name:'三何起步',sub:'何人＋何地＋何事',focus:'組成清楚的基本句'},
  2:{name:'五何擴寫',sub:'加入何時＋如何',focus:'補充時間與動作'},

  8:{name:'遷移寫作與自我檢核',sub:'連結自己的經驗',focus:'用到生活中、檢查自己的文章'}
};
const SUPS = {choices:'圈選',bank:'提示詞／詞庫',frame:'句型',cards:'事件卡',model:'範例',speak:'先說再寫（語音輸入）'};
const PRESET = {'多':['choices','bank','frame','cards','model','speak'],'中':['bank','frame','cards','speak'],'少':['speak']};
const CHECK4 = [['內容完整','交代人物、時間、地點與主要事件'],['組織清楚','依序敘述，說明原因與方法'],['描寫具體','加入人物心情、想法或發現'],['自主修訂','檢查標點與錯字']];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const versions = (L.versions && L.versions.length) ? L.versions : [{name:'通用版',levels:Object.keys(L.levels).map(Number),support:'中'}];
function supList(v){ return v.supports || PRESET[v.support||'中'] || PRESET['中']; }
function lvls(v){ return (v.levels||[]).map(Number).filter(n=>L.levels[n]); }
// 所有欄位：key → {label, ans}
const FIELDS = {};
Object.entries(L.levels).forEach(([n,lv])=>(lv.fields||[]).forEach(f=>{ if(!FIELDS[f.key]) FIELDS[f.key]=f; }));
function color(n){ return `var(--c${n})`; }
function tint(n){ return `var(--t${n})`; }

/* =====================================================================
   學習單（sheet／teacher）
   ===================================================================== */
function disp(f){ if(!f) return ''; if(f.show) return f.show; const a=f.ans||[]; const c=(f.choices||[]).find(x=>a.some(k=>k&&x.includes(k))); return c||a[0]||''; }
function shuffled(arr, seed){ // 固定亂數，學習單與網頁一致；保證不是原順序
  const a = arr.map((x,i)=>[x,i]); let s=seed||7;
  for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if(a.length>1 && a.every((x,i)=>x[1]===i)) a.push(a.shift());
  return a.map(x=>x[0]);
}
function matHTML(cls){
  const m = L.material||{}; let h='';
  if(m.image) h += `<div style="text-align:center"><img src="${esc(m.image)}" alt="${esc(m.imageAlt||'素材圖片')}" style="max-height:60mm"></div>`;
  if(m.text && m.text.length) h += m.text.map(p=>`<p>${esc(p)}</p>`).join('');
  return h;
}
function fillFrame(fr, ans){ // 句型 → 空格（教師版填紅字）
  return esc(fr).replace(/\{(\w+)\}/g,(m,k)=>{
    const f=FIELDS[k]; const lab=f?f.label.replace(/[（(].*$/,''):k;
    const v = ans && disp(f);

  });
}
function lines(n, val){
  if(val) return String(val).split('\n').map(t=>`<div class="wl ansl">${esc(t)}</div>`).join('');
  let h=''; for(let i=0;i<n;i++) h+='<div class="wl"></div>'; return h;
}
function gridPaper(rows){ let h=''; for(let i=0;i<rows*17;i++) h+='<i></i>'; return `<div class="gridp">${h}</div>`; }
function bankHTML(name, list){ return `<div class="pbank"><b>${esc(name)}</b>${list.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`; }
function sheetLevel(n, lv, sup, ans){
  const has = k=>sup.includes(k);
  const type = lv.type || ({4:'sort',6:'parts',7:'essay',8:'transfer'}[n]) || 'fields';

        const opts = has('choices') && f.choices && f.choices.length;
        const long = opts || disp(f).length>8 || /為何|原因|如何/.test(f.label) || type==='transfer';
        c += `<div class="it${long?' wide':''}"><b>${esc(f.label)}</b>`;
        c += opts ? `<span class="op">${f.choices.map(x=>`<span class="${ans&&x===disp(f)?'ok':''}">${esc(x)}</span>`).join('')}</span>`
                  : `<span class="bl">${ans?esc(disp(f)):''}</span>`;
        c += '</div>';
      });
      c += '</div>';
      if(has('bank')) fs.filter(f=>f.bank&&f.bank.length).forEach(f=> c += bankHTML(f.bankName||(f.label+'提示詞'), f.bank));
    }
    if(has('bank') && lv.bank && lv.bank.length) c += bankHTML(lv.bankName||'提示詞', lv.bank);
    if(has('frame') && lv.frame) c += `<div class="pframe"><b>句型</b>${fillFrame(lv.frame, ans)}</div>`;
    if(lv.sentence!==false) c += `<div class="wlab">✏️ ${esc(lv.sentenceLabel||'寫成完整的句子')}</div>` + lines(lv.lines||2, ans?lv.model:'');
    if(type==='transfer') c += `<div class="pck"><b>我會檢查：</b>${(lv.checks||CHECK4.map(x=>x[0])).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
  } else if(type==='sort'){
    const ev = lv.events||[]; const L8='ABCDEFGH';
    if(has('cards')){
      const sh = shuffled(ev, 7);
      c += `<div class="pcards">${sh.map((e,i)=>`<span><em>${L8[i]}</em>${esc(e)}</span>`).join('')}</div>`;
      c += `<div class="psort">${ev.map((e,i)=>`<span class="sb"><sup>${i+1}</sup>${ans?L8[sh.indexOf(e)]:''}</span>${i<ev.length-1?'<span class="ar">➜</span>':''}`).join('')}</div>`;
    } else {
      c += `<div class="psort">${ev.map((e,i)=>`<span class="sb wide"><sup>${i+1}</sup>${ans?esc(e):''}</span>${i<ev.length-1?'<span class="ar">➜</span>':''}`).join('')}</div>`;
    }
    if(has('bank') && lv.connectors) c += bankHTML('連接詞', lv.connectors);
    if(has('frame') && lv.frame) c += `<div class="pframe"><b>句型</b>${esc(lv.frame)}</div>`;

  } else if(type==='parts'){

  } else if(type==='essay'){

function blank(){ return {step:0, a:{}, order:{}, done:{}, sup:null}; }

function chipRow(list, target, cls){ return `<div class="chips">${list.map(x=>`<button class="chip ${cls||''}" data-ins="${esc(x)}" ${target?`data-to="${target}"`:''}>${esc(x)}</button>`).join('')}</div>`; }

function webLevel(n, lv){

function mats(n){
  const out=[]; lvls(V()).filter(k=>k<n).forEach(k=>{

  }); return out;
}
let lastInput = null;
function bind(){
  $$('[data-k]').forEach(el=>{
    const k=el.dataset.k;
    if(el.type==='checkbox'){ el.onchange=()=>{ S.a[k]=el.checked; save(); }; return; }

    el.addEventListener('input',()=>{ S.a[k]=el.value; save(); el.classList.remove('good','try'); updFrames(); updCnt(); });
  });
  lastInput = $('[data-k]:not([type=checkbox])');
  $$('[data-set]').forEach(b=>b.onclick=()=>{ const k=b.dataset.set; S.a[k]=b.dataset.val; save(); const el=$(`[data-k="${k}"]`); if(el) el.value=S.a[k]; $$(`[data-set="${k}"]`).forEach(x=>x.classList.toggle('on',x===b)); updFrames(); speak(b.dataset.val); });
  $$('[data-ins]').forEach(b=>b.onclick=()=>{ const el = b.dataset.to ? $(`[data-k="${b.dataset.to}"]`) : lastInput; if(!el) return; insertAt(el, b.dataset.ins); speak(b.dataset.ins); });
  $$('[data-copyframe]').forEach(b=>b.onclick=()=>{ const lv=L.levels[b.dataset.copyframe]; const t=lv.frame.replace(/\{(\w+)\}/g,(m,k)=>S.a[k]||'＿＿'); setVal('s'+b.dataset.copyframe, t); });
  $$('[data-start]').forEach(b=>b.onclick=()=>{ const el=$(`[data-k="${b.dataset.start}"]`); if(el && !el.value.startsWith(b.dataset.text)) setVal(b.dataset.start, b.dataset.text + el.value); });
  $$('[data-mats]').forEach(b=>b.onclick=()=>{ const k='s'+b.dataset.mats; const m=mats(+b.dataset.mats).map(x=>x.replace(/^(開始|經過|結果)[：:]/,'')).join('\n'); const el=$(`[data-k="${k}"]`); if(el.value && !confirm('要把材料加在你寫的內容後面嗎？')) return; setVal(k, (el.value?el.value+'\n':'')+m); });
  $$('[data-card]').forEach(b=>b.onclick=()=>{ const n=+$('.lv').dataset.n; const ev=L.levels[n].events; const ord=S.order[n]||Array(ev.length).fill(null); const i=ord.indexOf(null); if(i<0) return; ord[i]=b.dataset.card; S.order[n]=ord; save(); speak(b.dataset.card); rerender(); });
  $$('[data-slot]').forEach(b=>b.onclick=()=>{ const n=+$('.lv').dataset.n; const ord=S.order[n]; if(!ord) return; ord[+b.dataset.slot]=null; save(); rerender(); });
  $$('[data-chain]').forEach(b=>b.onclick=()=>{ const n=+b.dataset.chain; const lv=L.levels[n]; const ord=(S.order[n]||[]).filter(Boolean); if(!ord.length) return toast('先把事件卡排好喔'); const cj=lv.connectors||['首先','接著','然後','最後']; const t=ord.map((e,i)=>(i===ord.length-1?cj[cj.length-1]:cj[Math.min(i,cj.length-2)])+'，'+e).join('；')+'。'; setVal('s'+n,t); });
  $$('[data-mic]').forEach(b=>b.onclick=()=>listen(b));
  updCnt();
}
function rerender(){ const y=scrollY; renderWeb(); scrollTo(0,y); }
function setVal(k,t){ const el=$(`[data-k="${k}"]`); if(!el) return; el.value=t; S.a[k]=t; save(); updFrames(); updCnt(); el.focus(); }
function insertAt(el, t){ const s=el.selectionStart??el.value.length, e=el.selectionEnd??el.value.length; el.value=el.value.slice(0,s)+t+el.value.slice(e); el.focus(); el.selectionStart=el.selectionEnd=s+t.length; el.dispatchEvent(new Event('input')); }
function updFrames(){ $$('[data-fv]').forEach(x=>{ const v=S.a[x.dataset.fv]; x.classList.toggle('empty',!v); if(v) x.textContent=v; }); }
function updCnt(){ $$('[data-cnt]').forEach(x=>{ const v=(S.a[x.dataset.cnt]||'').replace(/\s/g,''); x.textContent=`已寫 ${v.length} 字`; }); }
function go(d){ stopTTS(); const st=steps(); const cur=st[S.step]; if(d>0 && cur!=='mat') S.done[cur]=true; S.step=Math.max(0,Math.min(st.length-1,S.step+d)); save(); renderWeb(); scrollTo(0,0); }
function jump(i){ stopTTS(); S.step=i; save(); renderWeb(); scrollTo(0,0); }
function fsz(d){ const v=Math.max(.8,Math.min(1.6,(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||1)+d*.1)); document.documentElement.style.setProperty('--fs',v); try{localStorage.setItem(KEY+'fs',v);}catch(e){} }

/* ---- 對答案：有標準答案的比對關鍵詞；開放題給檢查提示，不打分數 ---- */
function hit(val, ans){ val=(val||'').replace(/\s/g,''); return ans.some(a=>a && val.includes(a.replace(/\s/g,''))); }
function checkStep(){
  const st=steps(); const n=st[S.step]; const fb=$('#fb'); if(!fb) return toast('讀完素材就按「下一步」');
  const lv=L.levels[n]; const type = lv.type || ({4:'sort',6:'parts',7:'essay',8:'transfer'}[n]) || 'fields';
  const msg=[]; let good=0, total=0, empty=0;
  if(type==='fields'||type==='transfer'){
    (lv.fields||[]).forEach(f=>{ const el=$(`[data-k="${f.key}"]`); const v=S.a[f.key]||''; if(!v){empty++; el&&el.classList.add('try'); return;} if(f.ans&&f.ans.length&&!f.open&&L.mode!=='topic'){ total++; if(hit(v,f.ans)){good++; el.classList.add('good');} else { el.classList.add('try'); msg.push(`「${f.label}」再想想：${(f.hint||'回去看看素材').replace(/[。？?！!]$/,'')}${/[？?]$/.test(f.hint||'')?'？':'。'}`); } } else el&&el.classList.add('good'); });
    if(lv.sentence!==false){ const s=S.a['s'+n]||''; const el=$(`[data-k="s${n}"]`);
      if(!s) { empty++; el&&el.classList.add('try'); }
      else { const keys=(lv.frame||'').match(/\{(\w+)\}/g)||[]; const miss=keys.map(k=>k.slice(1,-1)).filter(k=>S.a[k] && !s.includes(S.a[k])).map(k=>FIELDS[k].label.replace(/[（(].*$/,'')); if(miss.length){ el.classList.add('try'); msg.push(`句子裡還沒用到：${miss.join('、')}。`);} else el.classList.add('good'); if(!/[。！？!?]$/.test(s.trim())) msg.push('句子最後記得加上標點符號（。！？）。'); }
    }
  } else if(type==='sort'){
    const ev=lv.events; if(on('cards')){ const ord=S.order[n]||[]; ev.forEach((e,i)=>{ total++; const sl=$(`[data-slot="${i}"]`); if(!ord[i]) {empty++; return;} if(ord[i]===e){good++; sl.classList.add('good');} else sl.classList.add('bad'); }); if(good<total && !empty) msg.push('有些順序再想想：先發生什麼事，後來呢？'); }
    const s=S.a['s'+n]||''; if(!s) empty++; else { const cj=(lv.connectors||[]).filter(c=>s.includes(c)); if(cj.length<2) msg.push('試著用兩個以上的連接詞，例如「首先、接著、最後」。'); }
  } else if(type==='parts'){
    (lv.parts||[]).forEach(p=>{ const v=S.a[p.key]||''; const el=$(`[data-k="${p.key}"]`); if(!v){empty++; el.classList.add('try');} else el.classList.add('good'); });
  } else if(type==='essay'){
    const s=(S.a['s'+n]||'').replace(/\s/g,''); if(!s) empty++; else { const w=String(lv.words||'').match(/\d+/); if(w && s.length < +w[0]) msg.push(`目前 ${s.length} 字，目標約 ${lv.words} 字，可以再加一點心情或想法。`); if(!/[，。]/.test(s)) msg.push('記得加上標點符號。'); msg.push('用下面的四個檢核項目，自己檢查一次。'); }
  }
  let cls='good', text;
  if(empty) { cls='try'; text = `還有 ${empty} 個地方還沒寫，${on('speak')?'也可以按 🎤 用說的，':''}慢慢來。`; }
  else if(msg.length) { cls='try'; text = '寫得很認真！'+msg.join(''); }
  else text = '太棒了！這一層完成了，可以按「下一步」。';
  if(!empty && !msg.filter(m=>!m.startsWith('用下面')).length) S.done[n]=true;
  fb.className='fb show '+cls; fb.textContent=text; save(); speak(text);
}

/* ---- 報讀（優先用曉臻 HsiaoChen，語速 0.9） ---- */
const synth = window.speechSynthesis; let voice=null;
function pickVoice(){ if(!synth) return; const vs=synth.getVoices(); const want=(()=>{try{return localStorage.getItem(KEY+'voice')}catch(e){return null}})();
  voice = vs.find(v=>v.name===want) || vs.find(v=>/HsiaoChen|曉臻/i.test(v.name)) || vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function clean(t){ return String(t).replace(/[✏️🧩🗣️🔊🎤📖⬇➜→✔☰]/g,'').replace(/＿+/g,'空格').replace(/\s+/g,' ').trim(); }
function speak(t, el){ if(!synth||!t) return; synth.cancel(); const u=new SpeechSynthesisUtterance(clean(t)); if(voice){u.voice=voice;u.lang=voice.lang;} else u.lang='zh-TW'; u.rate=+(localStorage.getItem(KEY+'rate')||0.9); if(el){ el.classList.add('speak'); u.onend=u.onerror=()=>el.classList.remove('speak'); } synth.speak(u); }
function sayEl(root){ const items=$$('[data-read]',root); if(!synth||!items.length) return; synth.cancel(); items.forEach(el=>{ const u=new SpeechSynthesisUtterance(clean(el.innerText)); if(voice){u.voice=voice;u.lang=voice.lang;} else u.lang='zh-TW'; u.rate=+(localStorage.getItem(KEY+'rate')||0.9); u.onstart=()=>el.classList.add('speak'); u.onend=u.onerror=()=>el.classList.remove('speak'); synth.speak(u); }); }
function readStep(){ const c=$('.wrap .card'); if(c) sayEl(c); }
function stopTTS(){ if(synth) synth.cancel(); }

/* ---- 先說再寫：語音輸入（Chrome／Edge 支援） ---- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null;
function listen(b){
  if(!SR) return toast('這個瀏覽器不能語音輸入，請老師幫忙寫下來');
  if(rec){ rec.stop(); return; }
  const el=$(`[data-k="${b.dataset.mic}"]`); rec=new SR(); rec.lang='zh-TW'; rec.interimResults=false;
  b.classList.add('on'); toast('請說話……說完再按一次 🎤');
  rec.onresult=e=>{ const t=[...e.results].map(r=>r[0].transcript).join(''); insertAt(el,t); };
  rec.onend=()=>{ b.classList.remove('on'); rec=null; };
  rec.onerror=()=>{ toast('沒有聽清楚，再試一次'); };
  rec.start();
}

/* ---- 更多選單 ---- */
function menuHTML(){
  const cur = S.sup||supList(V());
  return `<div class="menu" id="menu" onclick="if(event.target===this)menu(false)"><div class="pan">
  <button class="big" style="float:right" onclick="menu(false)">✕</button><h2 style="margin:4px 0 0">更多</h2>
  <h3>學習支持（提示量）</h3><div class="seg">${['多','中','少'].map(p=>`<button class="${JSON.stringify(PRESET[p])===JSON.stringify(cur)?'on':''}" onclick="setPreset('${p}')">提示${p}</button>`).join('')}</div>
  ${Object.entries(SUPS).map(([k,t])=>`<label class="sw"><input type="checkbox" ${cur.includes(k)?'checked':''} onchange="togSup('${k}',this.checked)"> ${t}</label>`).join('')}
  <button class="mb" onclick="resetSup()">↺ 回到這個版本的預設</button>
  ${versions.length>1?`<h3>切換版本</h3>${versions.map((v,i)=>`<button class="mb" onclick="pickV(${i});menu(false)">${i===S.v?'● ':''}${esc(v.name)}</button>`).join('')}`:''}
  <h3>報讀</h3><label class="sw">語速 <select onchange="try{localStorage.setItem(KEY+'rate',this.value)}catch(e){}"><option value="0.7">慢</option><option value="0.9" selected>中</option><option value="1.1">快</option></select></label>
  <label class="sw">語音 <select id="vsel" onchange="try{localStorage.setItem(KEY+'voice',this.value)}catch(e){};pickVoice();speak('你好，我是報讀小幫手。')"></select></label>
  <h3>其他</h3>
  <h3>字型</h3><div class="seg">${[['iansui','芫荽'],['kai','標楷'],['bpmf','芫荽注音']].map(([k,t])=>`<button class="${curFont()===k?'on':''}" onclick="setFont('${k}');renderWeb();menu(true)">${t}</button>`).join('')}</div>
  <button class="mb" onclick="showRec()">📋 作答紀錄</button>
  <button class="mb" onclick="toggleFS()">⛶ 全螢幕</button>
  <button class="mb" onclick="if(confirm('要清除這台電腦上的全部作答嗎？')){Object.assign(S,blank());save();menu(false);renderWeb();}">🗑 清除作答</button>
  </div></div>`;
}
function menu(o){ $('#menu').classList.toggle('show',o); if(o&&synth){ const s=$('#vsel'); const vs=synth.getVoices().filter(v=>/^zh/i.test(v.lang)); s.innerHTML=vs.map(v=>`<option ${voice&&v.name===voice.name?'selected':''}>${esc(v.name)}</option>`).join('')||'<option>（系統預設中文）</option>'; } }
function setPreset(p){ S.sup=PRESET[p].slice(); save(); renderWeb(); menu(true); }
function togSup(k,o){ const c=(S.sup||supList(V())).slice(); S.sup = o ? [...new Set([...c,k])] : c.filter(x=>x!==k); save(); renderWeb(); menu(true); }
function resetSup(){ S.sup=null; save(); renderWeb(); menu(true); }
function toggleFS(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }

/* ---- 作答紀錄 ---- */
function buildRec(){
  const v=V(); const cur=S.sup||supList(v); const name=($('#recName')||{}).value||'';
  let t = `六何法分層寫作｜${L.title}\n版本：${v.name}　姓名：${name}　日期：${new Date().toLocaleDateString('zh-TW')}\n使用的學習支持：${cur.map(s=>SUPS[s]).join('、')||'無'}\n`;
  lvls(v).forEach(n=>{ const lv=L.levels[n]; const type=lv.type||({4:'sort',6:'parts',7:'essay',8:'transfer'}[n])||'fields';
    t += `\n【${n} ${LV[n].name}】${S.done[n]?'✔ 完成':'未完成'}\n`;
    (lv.fields||[]).forEach(f=>{ if(S.a[f.key]) t+=`${f.label}：${S.a[f.key]}\n`; });
    if(type==='sort' && S.order[n]) t += `事件順序：${S.order[n].map(x=>x||'＿').join(' → ')}\n`;
    (lv.parts||[]).forEach(p=>{ if(S.a[p.key]) t+=`${p.label}：${S.a[p.key]}\n`; });
    if(S.a['s'+n]) t += `${type==='essay'?'作文':'句子'}：${S.a['s'+n]}\n`;
    const ck=(lv.checks||CHECK4.map(x=>x[0])).map((x,i)=>S.a['ck'+n+'_'+i]?x:null).filter(Boolean); if(ck.length) t+=`自我檢核：${ck.join('、')}\n`;
  });
  const done=lvls(v).filter(n=>S.done[n]).length;
  t += `\n完成 ${done}／${lvls(v).length} 層。`;
  const next = lvls(v).find(n=>!S.done[n]);
  t += next ? `建議下一步：繼續第 ${next} 層「${LV[next].name}」。` : (cur.length>2?'建議下一步：全部完成，下次可以減少提示量（例如改成「提示少」）。':'建議下一步：全部完成，可以挑戰更高的層次或新的題目。');
  $('#recText').textContent=t; return t;
}
function showRec(){ menu(false); buildRec(); $('#rec').classList.add('show'); }
function copyRec(){ const t=buildRec(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('已複製'),()=>{ const r=document.createRange(); r.selectNode($('#recText')); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); toast('已複製'); }); }
function printRec(){ const w=window.open(''); w.document.write(`<pre style="font-family:${getComputedStyle(document.body).fontFamily};white-space:pre-wrap;font-size:14pt">${esc(buildRec())}</pre>`); w.document.close(); w.print(); }

/* ---- 字型：芫荽（預設）／標楷（教育部標準楷書優先）／芫荽注音 ---- */
function curFont(){ return document.body.classList.contains('kai')?'kai':document.body.classList.contains('bpmf')?'bpmf':'iansui'; }
function setFont(k){
  document.body.classList.remove('kai','bpmf'); if(k!=='iansui') document.body.classList.add(k);
  if(k==='bpmf' && !document.getElementById('bpmfFont')){ const l=document.createElement('link'); l.id='bpmfFont'; l.rel='stylesheet'; l.href='https://fonts.googleapis.com/css2?family=Bpmf+Iansui&display=swap'; document.head.appendChild(l); }
  try{ if(MODE==='web') localStorage.setItem(KEY+'font',k); }catch(e){}
}
/* ---- 啟動 ---- */
(()=>{ let f=L.font||'iansui'; try{ if(MODE==='web') f=localStorage.getItem(KEY+'font')||f; }catch(e){} setFont(f); })();
try{ const f=localStorage.getItem(KEY+'fs'); if(f) document.documentElement.style.setProperty('--fs',f); }catch(e){}
if(MODE==='sheet') renderSheet(false); else if(MODE==='teacher') renderSheet(true); else renderWeb();
</script>
